# Снимок таблицы карточек: вписывает нынешнее содержимое таблицы прямо в страницу,
# чтобы при её открытии сразу показывался верный текст, а не прежний.
# Запускается сигналом от самой таблицы, когда её правят.
name: Snapshot cards

on:
  repository_dispatch:        # сигнал от таблицы: её содержимое изменилось
    types: [cards-changed]
  workflow_dispatch:          # и по нажатию вручную

permissions:
  contents: write

concurrency:
  group: snapshot-cards
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Вписать нынешнее состояние таблицы в страницу
        run: python3 tools/snapshot_cards.py

      - name: Записать, если содержимое изменилось
        run: |
          git config user.name "Снимок карточек"
          git config user.email "actions@github.com"
          git add ms-value4.html
          git diff --staged --quiet && exit 0
          git commit -m "снимок карточек $(date -u +%d.%m.%Y' '%H:%M)"
          # если нас опередил другой снимок — подтянуть и повторить, а не падать
          for попытка in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase --autostash origin main || true
            sleep $((попытка * 3))
          done
          echo "не удалось записать снимок после пяти попыток"
          exit 1
